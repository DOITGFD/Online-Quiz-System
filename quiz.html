<!DOCTYPE html>
<html>

<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2 id="welcome" class="welcome-text"></h2>

        <div id="timer" class="timer">Time: 60</div>

        <form id="quizForm" class="quiz-form" action="#" method="post" enctype="application/x-www-form-urlencoded">

        <button type="button" class="submit-btn" title="Submit the quiz" onclick="submitQuiz()">
Submit Quiz

        <h2 id="result" class="result-text"></h2>

    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>

</html>
