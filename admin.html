<!DOCTYPE html>
<html>

<head>
    <title>Online Quiz Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 class="title">Online Quiz System</h1>

        <input type="text" id="username" name="username" class="input-field" placeholder="Enter Name" title="Enter your name to start the quiz">

        <br><br>

        <button type="button" class="start-btn" title="Click to start the quiz" onclick="startQuiz()">
Start Quiz
</button>

        <br><br>

        <a href="admin.html" class="admin-link" title="Go to admin panel">
Admin Panel
</a>

    </div>

    <script>
        function startQuiz() {

            var name = document.getElementById("username").value;

            if (name == "") {
                alert("Enter your name");
                return;
            }

            localStorage.setItem("username", name);
            window.location.href = "quiz.html";

        }
    </script>

</body>

</html>
